[project]
name = "rococoach"
version = "0.1.0"
description = "RocoCoach 三天 AI Coach 面试项目"
requires-python = ">=3.12,<3.13"
dependencies = [
    "streamlit>=1.45,<2",
    "python-dotenv>=1.1,<2",
    "openai>=2,<3",
    "pydantic>=2,<3",
]

[dependency-groups]
dev = [
    "pip>=26,<27",
    "pytest>=8,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
